name: Update Pulse snapshots

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare private snapshot branch
        run: |
          if git ls-remote --exit-code --heads origin pulse-snapshots >/dev/null 2>&1; then
            git fetch origin pulse-snapshots
            git worktree add --detach ../pulse-state origin/pulse-snapshots
          else
            git worktree add --detach ../pulse-state
            git -C ../pulse-state switch --orphan pulse-snapshots
          fi

      - name: Refresh static Pulse snapshots
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULSE_SNAPSHOT_ROOT: ../pulse-state/snapshots
        run: pnpm run update:pulse

      - name: Commit successful snapshots
        working-directory: ../pulse-state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Pulse snapshot changes."
          else
            git commit -m "chore(pulse): update static snapshots"
            git push origin HEAD:pulse-snapshots
          fi
