name: Backup visit statistics

on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export protected stats
        env:
          STATS_BACKUP_URL: ${{ secrets.STATS_BACKUP_URL }}
          STATS_BACKUP_TOKEN: ${{ secrets.STATS_BACKUP_TOKEN }}
        run: pnpm run backup:stats

      - name: Upload private backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: stats-backup
          path: .local/stats-backups/*.json
          retention-days: 90
